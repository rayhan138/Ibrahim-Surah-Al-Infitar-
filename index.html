<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Surahs for Ibrahim</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Amiri+Quran&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <style></style>
    <style id="dynamic-font-style"></style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Assalamualaikum 🌟</h1>
            <p id="page-subtitle">Memorization with Ibrahim: Surah Al-Infitar (The Shattering)</p>
        </div>

        <div class="card selector-card">
            <label class="selector-label" for="surah-select">Choose a Surah</label>
            <select id="surah-select" class="surah-select">
                <option value="infitar">Surah Al-Infitar (82)</option>
                <option value="takweer">Surah At-Takweer (81)</option>
            </select>
        </div>

        <div id="about-card" class="card info-card"></div>

        <div class="card bismillah">
            <div class="arabic" style="font-family: 'Page1Font'; text-align: center; font-size: 4.2rem; line-height: 1.2;">ﱁ ﱂ ﱃ ﱄ</div>
            <div class="english"><span class="emoji">🤲</span>In the name of Allah, the Most Kind, the Most Caring.</div>
            <button class="play-btn" data-default-label="Play Bismillah" onclick="playAyah(0, this)"><span>🔊</span> Play Bismillah</button>
        </div>

        <div id="section-heading" class="section-heading">Ayahs to Learn</div>
        <div id="ayah-list"></div>

        <div id="lessons-card" class="card lessons-card" hidden></div>
    </div>

    <script src="data/surahData.js"></script>
    <script src="assets/js/app.js" defer></script>
</body>
</html>
